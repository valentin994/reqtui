name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  publish-crate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo publish --token ${{ secrets.CARGO_REGISTRY_TOKEN }}

  release-deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-deb
      - run: cargo deb
      - run: cp target/debian/*.deb reqtui_latest_amd64.deb
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            target/debian/*.deb
            reqtui_latest_amd64.deb
