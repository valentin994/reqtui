[package]
name = "reqtui"
version = "0.1.0"
edition = "2024"

[dependencies]
color-eyre = "0.6.5"
ratatui = "0.30.0"
reqwest = "0.13.3"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
tokio = { version = "1.52.3", features = ["full"] }
tokio-util = "0.7.18"
tui-input = { version = "*", features = ["crossterm"], default-features = false }
