[package]
name = "reqtui"
version = "0.1.0"
edition = "2024"

[package.metadata.deb]
maintainer = "Valentin Vareskic <valentin.vareskic@gmail.com>"
assets = [
    ["target/release/reqtui", "usr/bin/", "755"],
]

[dependencies]
color-eyre = "0.6.5"
directories = "6.0.0"
futures = "0.3.32"
indexmap = "2.14.0"
ratatui = "0.30.0"
ratatui-textarea = "0.9.1"
regex = "1.13.0"
reqwest = { version = "0.13.3", features = ["json"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
throbber-widgets-tui = "0.11.0"
tokio = { version = "1.52.3", features = ["full"] }
tokio-util = "0.7.18"
tui-input = { version = "*", features = ["crossterm"], default-features = false }
